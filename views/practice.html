<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">Math Learning Platform(Mathodology)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/student">Main Page</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/practice">Practice</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/materials">Materials</a>
                    </li>
                </ul>
                <div class="navbar-text me-3" id="username-display"></div>
                <button class="btn btn-outline-secondary btn-sm logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">After-School Practice</h2>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Practice Settings</h5>
                    </div>
                    <div class="card-body">
                        <form id="practice-form">
                            <div class="mb-3">
                                <label for="grade-select" class="form-label">Select Grade:</label>
                                <select id="grade-select" class="form-select mb-3">
                                    <option value="1">Primary 1</option>
                                    <option value="2">Primary 2</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category-select" class="form-label">Select Category:</label>
                                <select id="category-select" class="form-select mb-3">
                                    <optgroup label="P1 Topics" id="p1-categories">
                                        <option value="numbers_to_20">Numbers to 20</option>
                                        <option value="hard_numbers_to_20">Numbers to 20 (Advanced)</option>
                                        <option value="basic_operations">Basic Operations</option>
                                        <option value="hard_basic_operations">Basic Operations (Advanced)</option>
                                        <option value="numbers_to_100">Numbers to 100</option>
                                        <option value="hard_numbers_to_100">Numbers to 100 (Advanced)</option>
                                        <option value="measurement">Measurement</option>
                                        <option value="hard_measurement">Measurement (Advanced)</option>
                                        <option value="money">Money</option>
                                        <option value="hard_money">Money (Advanced)</option>
                                        <option value="time">Time</option>
                                        <option value="hard_time">Time (Advanced)</option>
                                        <option value="geometry_2d">2D Shapes</option>
                                        <option value="hard_geometry_2d">2D Shapes (Advanced)</option>
                                        <option value="geometry_3d">3D Shapes</option>
                                        <option value="hard_geometry_3d">3D Shapes (Advanced)</option>
                                        <option value="positions">Positions</option>
                                        <option value="calendar">Calendar</option>
                                        <option value="hard_calendar">Calendar (Advanced)</option>
                                    </optgroup>
                                    <optgroup label="P2 Topics" id="p2-categories" style="display:none">
                                        <option value="p2_addition">Addition</option>
                                        <option value="p2_hard_addition">Addition (Advanced)</option>
                                        <option value="p2_subtraction">Subtraction</option>
                                        <option value="p2_hard_subtraction">Subtraction (Advanced)</option>
                                        <option value="p2_angles">Angles</option>
                                        <option value="p2_directions">Directions</option>
                                        <option value="p2_multiplication">Multiplication</option>
                                        <option value="p2_hard_multiplication">Multiplication (Advanced)</option>
                                        <option value="p2_division">Division</option>
                                        <option value="p2_hard_division">Division (Advanced)</option>
                                        <option value="p2_mixed_operations">Mixed Operations</option>
                                        <option value="p2_hard_mixed_ops">Mixed Operations (Advanced)</option>
                                        <option value="p2_time">Time</option>
                                        <option value="p2_date">Date & Calendar</option>
                                        <option value="p2_shapes">Shapes</option>
                                        <option value="p2_data">Data & Pictographs</option>
                                        <option value="p2_measurement">Measurement</option>
                                        <option value="p2_money">Money</option>
                                    </optgroup>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="question-count" class="form-label">Number of Questions:</label>
                                <select id="question-count" class="form-select">
                                    <option value="5">5 Questions</option>
                                    <option value="10" selected>10 Questions</option>
                                    <option value="15">15 Questions</option>
                                    <option value="20">20 Questions</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Generate Practice Questions</button>
                        </form>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Practice Statistics</h5>
                    </div>
                    <div class="card-body" id="practice-stats">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Correct Answers:</span>
                            <span id="correct-count">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Total Questions:</span>
                            <span id="total-count">0</span>
                        </div>
                        <div class="progress mb-2">
                            <div class="progress-bar" id="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <div class="text-center" id="accuracy-display">Accuracy: 0%</div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Current Question</h5>
                    </div>
                    <div class="card-body" id="question-container">
                        <div class="text-center py-5">
                            <p>Click "Generate Practice Questions" to start practicing</p>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-body d-flex justify-content-between">
                        <button id="prev-question" class="btn btn-secondary" disabled>Previous Question</button>
                        <button id="next-question" class="btn btn-primary" disabled>Next Question</button>
                    </div>
                </div>
                
                <div id="result-container" class="mt-3" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/practice.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
