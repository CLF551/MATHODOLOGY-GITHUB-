<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Register</h1>
        <form id="register-form" class="card p-4">
            <div class="mb-3">
                <label for="register-username" class="form-label">Username</label>
                <input type="text" id="register-username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="register-password" class="form-label">Password</label>
                <input type="password" id="register-password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="register-role">Role</label>
                <select id="register-role" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div class="form-group mb-3" id="grade-form-group">
                <label>Grade</label>
                <select class="form-select" id="register-grade">
                    <option value="1">Primary 1</option>
                    <option value="2">Primary 2</option>
                </select>
            </div>
            <div class="form-group" id="class-form-group">
                <label for="register-class">Class</label>
                <select id="register-class" class="form-select" required>
                    
                    <optgroup label="一年级">
                        <option value="1A">1A</option>
                        <option value="1B">1B</option>
                        <option value="1C">1C</option>
                        <option value="1D">1D</option>
                    </optgroup>
                    
                    <optgroup label="二年级">
                        <option value="2A">2A</option>
                        <option value="2B">2B</option>
                        <option value="2C">2C</option>
                        <option value="2D">2D</option>
                    </optgroup>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="/login">Login here</a>.</p>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
